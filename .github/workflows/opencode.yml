name: opencode

# Issue / PR に /opencode または /oc とコメントすると、OpenCode が
# GitHub Actions の中で修正してブランチ + PR を作る。
#
# 【スマホ出口ノード版】モデル呼び出しの前に Tailscale へ参加し、
# 本人の Android スマホを出口ノードにして通信をスマホ回線から出す
# (Actions の共有IPは Zen 無料枠が枯れているため)。
# 必要な Secrets: TAILSCALE_OAUTH_CLIENT_ID / TAILSCALE_OAUTH_SECRET /
# TAILSCALE_EXIT_NODE (スマホの Tailscale IP 100.x.x.x)。
# スマホ側で Run as exit node の有効化と管理画面での承認が前提。
#
# モデルは無料枠のみ・学習に使われないモデルのみで2段フォールバック:
#   1段目: opencode/glm-5.3-flash-free (GLM-5.3-Flash Free)
#   2段目: opencode/deepseek-v4.1-flash-free (DeepSeek V4.1 Flash Free)
# 指示は AGENTS.md に集約 (SDK取得・検証コマンド禁止, 検証はCI)。
# 認証情報は保持する (persist-credentials 既定true): エージェントの git push に必要。
# PR作成には専用PAT (OPENCODE_PAT) を使う。ただしエージェントの push は
# GITHUB_TOKEN 相手でも PAT 相手でも後段ワークフローを自動開始しない
# (GitHub の連鎖防止仕様) ため、このワークフロー自身が push を検知して
# 同じ run の中で flutter-ci 相当 (scripts/ci_build.sh) を直接実行し、
# APK を dev リリースへ公開する (ci-build ジョブ)。push では起動しない
# flutter-ci.yml 本体は、通常の PR / main への push 用にそのまま残す。
# 無料枠が上限 (429) のとき OpenCode は長時間リトライし続けるため、
# 各段に制限時間 (25分) を付けて見切り、次段へ切り替える。
# 公開リポジトリなので、起動できるのはリポジトリ所有者 (hmsket) のコメントだけに制限する。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: >-
      github.event.comment.user.login == 'hmsket' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    outputs:
      pushed: ${{ steps.detect_push.outputs.pushed }}
      branch: ${{ steps.detect_push.outputs.branch }}
      new_pr: ${{ steps.detect_push.outputs.new_pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.OPENCODE_PAT }}

      - name: Configure git
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Setup Flutter (for the agent's local checks)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Connect Tailscale (exit node = my phone)
        timeout-minutes: 3
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          args: "--exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}"
          tags: tag:github-actions

      - name: Verify egress IP (should NOT be a GitHub/Azure IP)
        run: |
          tailscale status | grep -i 'exit node' || true
          echo "Egress IP: $(curl -s https://ifconfig.me)"

      # push 検知用スナップショット (opencode アクションは内部で push するため、
      # 前後比較で「この run で push が起きたか」と対象ブランチを判定する)
      - name: Snapshot refs (before)
        id: refs_before
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads" --jq '.[] | "\(.ref) \(.object.sha)"' | sort > /tmp/refs_before.txt
          wc -l /tmp/refs_before.txt

      - name: Run OpenCode (primary - GLM-5.3-Flash Free)
        id: oc_primary
        timeout-minutes: 40
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
        with:
          model: opencode/glm-5.3-flash-free
          use_github_token: true

      - name: Run OpenCode (fallback - DeepSeek V4.1 Flash Free)
        if: steps.oc_primary.outcome == 'failure'
        timeout-minutes: 40
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true

      # push 検知 (ci-build ジョブへの出力)。対象は opencode/ で始まるブランチのみ。
      - name: Detect agent push
        id: detect_push
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads" --jq '.[] | "\(.ref) \(.object.sha)"' | sort > /tmp/refs_after.txt
          changed=$(join -j 1 <(awk '{print $1, $2}' /tmp/refs_before.txt) <(awk '{print $1, $2}' /tmp/refs_after.txt) -o 0,1.2,2.2 2>/dev/null | awk '$2 != $3 {print $1}' || true)
          for ref in $(awk '{print $1}' /tmp/refs_after.txt); do
            if ! grep -q "^$ref " /tmp/refs_before.txt; then changed="$changed $ref"; fi
          done
          echo "changed branches: $changed"
          target=""
          for ref in $changed; do
            case "$ref" in
              refs/heads/opencode/*) target="$ref" ;;
            esac
          done
          if [ -n "$target" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "branch=${target#refs/heads/}" >> "$GITHUB_OUTPUT"
            if grep -q "^$target " /tmp/refs_before.txt; then
              echo "new_pr=false" >> "$GITHUB_OUTPUT"
            else
              echo "new_pr=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  # エージェントが push したブランチでは flutter-ci が自動開始されない
  # (GitHub の連鎖防止) ため、push を検知したらこの run の中で CI を回す。
  # 共有スクリプト scripts/ci_build.sh は flutter-ci.yml と同一内容で、
  # APK を dev リリースへ公開するまでを行う。
  ci-build:
    needs: opencode
    # エージェントが新規ブランチ+PRを作った場合は flutter-ci (pull_request) が
    # 担当するため、ここでは「既存PRブランチへの追加push」のときだけビルドする。
    # 新規PRの場合は ci-build はスキップされる (flutter-ci 側の承認が必要な点は従来通り)。
    if: >-
      always() && needs.opencode.result == 'success' &&
      needs.opencode.outputs.pushed == 'true' &&
      needs.opencode.outputs.new_pr != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.opencode.outputs.branch }}
          token: ${{ secrets.OPENCODE_PAT }}

      # PR ブランチには scripts/ci_build.sh がまだ無い場合があるため、
      # 実行前に main から取得する (main 側に v5 が入っていることが前提)。
      - name: Fetch CI script from main
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          mkdir -p scripts
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/ci_build.sh?ref=main" --jq '.content' | base64 --decode > scripts/ci_build.sh
          test -s scripts/ci_build.sh

      - name: Run CI build (same script as flutter-ci)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: bash scripts/ci_build.sh
