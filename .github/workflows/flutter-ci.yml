name: flutter-ci

# PR / main への push / 手動実行で、解析・テスト・APK ビルドを行う。
# ビルド本体は scripts/ci_build.sh (opencode.yml の ci-build ジョブと共有)。
# APK は固定リンクの dev リリースから取得するのが通常:
#   https://github.com/hmsket/kif-damari/releases/download/dev/kifdamari.apk
# 署名: Secrets に KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD が
#   設定されていればそのキーストアで署名し、上書きインストールで更新できる。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # dev リリースへ APK を公開するために必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run CI build (shared script)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci_build.sh

      - name: Upload arm64 APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kifdamari-apk-arm64
          path: build/ci-artifact/kifdamari-apk-arm64.apk
          if-no-files-found: error
